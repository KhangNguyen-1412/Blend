<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blend | Hệ Thống Quản Trị</title>
    
    <!-- Google Fonts: Playfair Display & Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blend: {
                            blue: '#124874',
                            red: '#CF373D',
                            paper: '#F9F8F6', // Màu nền kiểu giấy báo
                            border: '#E5E5E5'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        body: ['"Newsreader"', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F9F8F6;
            color: #1a1a1a;
        }
        /* Editorial border styles */
        .editorial-border {
            border: 1px solid #124874;
        }
        .editorial-border-b {
            border-bottom: 2px solid #124874;
        }
        .editorial-border-t {
            border-top: 1px solid #124874;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #124874;
            border-radius: 3px;
        }
    </style>
</head>
<body class="font-body text-base antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MOCK_DATA = {
            stats: {
                revenue: "45,230,000",
                orders: 245,
                success: 238,
                canceled: 7
            },
            topItems: [
                { id: 1, name: "Trà Oolong Kem Phô Mai", category: "Trà sữa", sold: 124, type: "drink" },
                { id: 2, name: "Cà Phê Muối Blend", category: "Cà phê", sold: 98, type: "drink" },
                { id: 3, name: "Trân Châu Trắng", category: "Topping", sold: 156, type: "topping" },
                { id: 4, name: "Kem Phô Mai", category: "Topping", sold: 89, type: "topping" }
            ],
            alerts: [
                { id: 1, type: 'order', message: "Có 3 đơn hàng mới chờ xác nhận." },
                { id: 2, type: 'inventory', message: "Sữa tươi không đường sắp hết (Còn 2 hộp)." }
            ],
            orders: [
                { id: "ORD-001", customer: "Nguyễn Văn A", total: "120,000đ", time: "10:20 AM", status: "Chờ xác nhận", payment: "MoMo", notes: "Ít đá, 50% đường" },
                { id: "ORD-002", customer: "Trần Thị B", total: "55,000đ", time: "10:15 AM", status: "Đang pha chế", payment: "Tiền mặt", notes: "Không lấy ống hút" },
                { id: "ORD-003", customer: "Lê Văn C", total: "210,000đ", time: "09:45 AM", status: "Đang giao", payment: "ZaloPay", notes: "" },
                { id: "ORD-004", customer: "Phạm D", total: "65,000đ", time: "09:10 AM", status: "Đã hoàn thành", payment: "Tiền mặt", notes: "" },
                { id: "ORD-005", customer: "Đặng E", total: "45,000đ", time: "08:30 AM", status: "Đã hủy", payment: "Thẻ Tín Dụng", notes: "Khách đổi ý (Đã Refund)" }
            ],
            products: [
                { id: "P01", name: "Trà Oolong Kem Phô Mai", category: "Trà sữa", price: "Từ 45,000đ", variants: "3 Size, 2 Mức đá/đường", status: "Còn hàng" },
                { id: "P02", name: "Cà Phê Muối Blend", category: "Cà phê", price: "Từ 35,000đ", variants: "2 Size", status: "Còn hàng" },
                { id: "P03", name: "Trà Đào Cam Sả", category: "Trà trái cây", price: "40,000đ", variants: "Size M (Cố định)", status: "Hết hàng" }
            ],
            inventory: [
                { id: "I01", name: "Sữa tươi không đường", unit: "Hộp 1L", qty: 2, min: 10, status: "warning" },
                { id: "I02", name: "Trà Oolong Lài", unit: "Kg", qty: 15, min: 5, status: "ok" },
                { id: "I03", name: "Hạt cà phê Robusta", unit: "Kg", qty: 20, min: 10, status: "ok" }
            ],
            customers: [
                { name: "Lê Minh Tuấn", phone: "0901234567", email: "tuan.le@email.com", tier: "Vàng", spent: "5,400,000đ" },
                { name: "Phạm Hà My", phone: "0912345678", email: "my.pham@email.com", tier: "Bạc", spent: "2,150,000đ" },
                { name: "Trần Anh Khoa", phone: "0987654321", email: "khoa.tran@email.com", tier: "Đồng", spent: "850,000đ" }
            ],
            promotions: [
                { code: "BLEND15K", discount: "Giảm 15,000đ", condition: "Đơn tối thiểu 50k", expiry: "30/09/2026", status: "Đang chạy" },
                { code: "FREESHIP", discount: "Miễn phí giao hàng", condition: "Tối đa 30k, cho đơn từ 100k", expiry: "15/09/2026", status: "Đang chạy" },
                { code: "THU2VUI", discount: "Giảm 20%", condition: "Dòng Trà Trái Cây, Tối đa 50k", expiry: "Hết hạn", status: "Đã kết thúc" }
            ],
            staff: [
                { name: "Hoàng Quyên", username: "quyen.admin", role: "Quản lý", status: "Hoạt động" },
                { name: "Nguyễn Cường", username: "cuong.tn", role: "Thu ngân", status: "Hoạt động" },
                { name: "Lê Pha", username: "pha.pc", role: "Pha chế", status: "Hoạt động" },
                { name: "Trần Tạm", username: "tam.pc", role: "Pha chế", status: "Nghỉ việc" }
            ]
        };

        const SectionHeader = ({ title, subtitle }) => (
            <div className="mb-8 border-b-2 border-blend-red pb-4">
                <h2 className="font-serif text-4xl text-blend-blue font-bold tracking-tight">{title}</h2>
                {subtitle && <p className="font-body text-gray-600 mt-2 text-lg italic">{subtitle}</p>}
            </div>
        );

        const StatusBadge = ({ status }) => {
            let color = "bg-gray-100 text-gray-800 border-gray-300";
            if (["Đã hoàn thành", "Còn hàng", "ok", "Đang chạy", "Hoạt động"].includes(status)) color = "bg-green-50 text-green-800 border-green-300";
            if (["Đang pha chế", "Đang giao"].includes(status)) color = "bg-blue-50 text-blue-800 border-blue-300";
            if (["Chờ xác nhận", "warning"].includes(status)) color = "bg-yellow-50 text-yellow-800 border-yellow-300";
            if (["Đã hủy", "Hết hàng", "Đã kết thúc", "Nghỉ việc"].includes(status)) color = "bg-red-50 text-blend-red border-blend-red";
            
            return (
                <span className={`px-3 py-1 text-sm font-semibold rounded-full border ${color}`}>
                    {status}
                </span>
            );
        };

        const DashboardView = () => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'CN'],
                            datasets: [{
                                label: 'Doanh thu (VNĐ)',
                                data: [12000000, 15000000, 14000000, 18000000, 22000000, 28000000, 31000000],
                                borderColor: '#124874',
                                backgroundColor: 'rgba(18, 72, 116, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); }
            }, []);

            return (
                <div className="space-y-6 text-blend-blue">
                    <SectionHeader title="Bảng Điều Khiển" subtitle="Tổng quan tình hình kinh doanh hôm nay, 20/08/2026." />
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        {[
                            { label: 'Tổng Doanh Thu', value: `${MOCK_DATA.stats.revenue}đ`, icon: 'fa-wallet', text: 'text-blend-red' },
                            { label: 'Tổng Đơn Hàng', value: MOCK_DATA.stats.orders, icon: 'fa-receipt' },
                            { label: 'Thành Công', value: MOCK_DATA.stats.success, icon: 'fa-check-circle' },
                            { label: 'Đã Hủy', value: MOCK_DATA.stats.canceled, icon: 'fa-times-circle', text: 'text-blend-red' }
                        ].map((stat, i) => (
                            <div key={i} className="editorial-border p-5 bg-white shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow border-t-4 border-t-transparent hover:border-t-blend-red">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-gray-500">{stat.label}</h3>
                                    <i className={`fa-solid ${stat.icon} ${stat.text || 'text-blend-blue'} text-xl`}></i>
                                </div>
                                <p className={`font-serif text-3xl font-bold ${stat.text || 'text-blend-blue'}`}>{stat.value}</p>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 editorial-border p-6 bg-white shadow-sm">
                            <h3 className="font-serif text-2xl font-bold mb-4">Xu Hướng Doanh Thu Tuần Này</h3>
                            <div className="h-72">
                                <canvas ref={chartRef}></canvas>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="editorial-border p-6 bg-white shadow-sm">
                                <h3 className="font-serif text-xl font-bold mb-4 border-b border-blend-blue pb-2">Top Thịnh Hành</h3>
                                <div className="space-y-4">
                                    <p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Đồ Uống</p>
                                    {MOCK_DATA.topItems.filter(i => i.type === 'drink').map((item, i) => (
                                        <div key={`d-${i}`} className="flex justify-between items-center">
                                            <div><p className="font-bold">{item.name}</p></div>
                                            <span className="font-serif font-bold text-lg">{item.sold} ly</span>
                                        </div>
                                    ))}
                                    <p className="text-xs font-bold text-gray-500 uppercase tracking-widest pt-2 border-t border-gray-100">Topping Bán Chạy</p>
                                    {MOCK_DATA.topItems.filter(i => i.type === 'topping').map((item, i) => (
                                        <div key={`t-${i}`} className="flex justify-between items-center">
                                            <div><p className="font-bold text-gray-700">{item.name}</p></div>
                                            <span className="font-serif font-bold text-lg text-gray-600">{item.sold} phần</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="editorial-border p-6 bg-blend-blue text-white shadow-sm">
                                <h3 className="font-serif text-xl font-bold mb-4 border-b border-white/30 pb-2">Cảnh Báo</h3>
                                <ul className="space-y-3">
                                    {MOCK_DATA.alerts.map((alert, i) => (
                                        <li key={i} className="flex gap-3 items-start text-sm">
                                            <i className={`fa-solid mt-1 ${alert.type === 'order' ? 'fa-bell text-yellow-300' : 'fa-triangle-exclamation text-blend-red'}`}></i>
                                            <span className={alert.type === 'inventory' ? 'text-blend-red font-bold' : ''}>{alert.message}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ProductsView = () => (
            <div>
                <SectionHeader title="Quản Lý Sản Phẩm" subtitle="Kiểm soát menu, phân loại, cấu hình giá bán và các biến thể." />
                
                <div className="flex justify-between items-center mb-6">
                    <div className="flex gap-4">
                        <select className="editorial-border px-4 py-2 bg-white focus:outline-none focus:ring-1 focus:ring-blend-blue">
                            <option>Tất cả danh mục</option>
                            <option>Cà phê</option>
                            <option>Trà sữa</option>
                        </select>
                        <input type="text" placeholder="Tìm kiếm món..." className="editorial-border px-4 py-2 bg-white w-64 focus:outline-none" />
                    </div>
                    <button className="bg-blend-red text-white px-6 py-2 font-bold hover:bg-opacity-90 transition-colors shadow-sm">
                        + Thêm Món Mới
                    </button>
                </div>

                <div className="bg-white editorial-border overflow-hidden shadow-sm">
                    <table className="w-full text-left border-collapse">
                        <thead>
                            <tr className="bg-blend-blue text-white font-serif text-lg">
                                <th className="p-4 border-b border-blend-blue font-normal">Mã</th>
                                <th className="p-4 border-b border-blend-blue font-normal">Tên Món</th>
                                <th className="p-4 border-b border-blend-blue font-normal">Biến Thể & Giá</th>
                                <th className="p-4 border-b border-blend-blue font-normal">Trạng Thái</th>
                                <th className="p-4 border-b border-blend-blue text-right font-normal">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            {MOCK_DATA.products.map((p, i) => (
                                <tr key={i} className="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                                    <td className="p-4 font-bold">{p.id}</td>
                                    <td className="p-4 font-serif text-lg">
                                        {p.name}<br/>
                                        <span className="text-sm italic text-gray-500 font-sans">{p.category}</span>
                                    </td>
                                    <td className="p-4">
                                        <span className="font-bold text-blend-red">{p.price}</span><br/>
                                        <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded inline-block mt-1 border border-gray-200">{p.variants}</span>
                                    </td>
                                    <td className="p-4"><StatusBadge status={p.status} /></td>
                                    <td className="p-4 text-right">
                                        <button className="text-blend-blue hover:underline mr-3"><i className="fa-solid fa-pen-to-square"></i> Sửa</button>
                                        <button className="text-blend-red hover:underline"><i className="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const OrdersView = () => (
            <div>
                <SectionHeader title="Quản Lý Đơn Hàng" subtitle="Điều phối bán hàng, cập nhật trạng thái, in tem và xử lý ngoại lệ." />
                
                <div className="flex gap-4 mb-6 overflow-x-auto pb-2">
                    {['Tất cả', 'Chờ xác nhận', 'Đang pha chế', 'Đang giao', 'Đã hoàn thành', 'Đã hủy'].map(tab => (
                        <button key={tab} className={`whitespace-nowrap px-4 py-2 border border-blend-blue font-semibold transition-colors ${tab === 'Tất cả' ? 'bg-blend-blue text-white shadow-sm' : 'text-blend-blue bg-white hover:bg-blend-blue/10'}`}>
                            {tab}
                        </button>
                    ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {MOCK_DATA.orders.map((order, i) => (
                        <div key={i} className="bg-white editorial-border p-5 shadow-sm relative group hover:shadow-md transition-shadow">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <h4 className="font-serif font-bold text-xl">{order.id}</h4>
                                    <p className="text-sm text-gray-500"><i className="fa-regular fa-clock"></i> {order.time}</p>
                                </div>
                                <StatusBadge status={order.status} />
                            </div>
                            <div className="border-t border-b border-gray-200 py-3 mb-4 space-y-1">
                                <p><strong>Khách hàng:</strong> {order.customer}</p>
                                <p className="text-sm text-gray-700"><strong>Thanh toán:</strong> <i className={`fa-solid ${order.payment === 'Tiền mặt' ? 'fa-money-bill-wave' : 'fa-credit-card'} mr-1`}></i>{order.payment}</p>
                                {order.notes && <p className="text-sm italic text-blend-red mt-2 bg-red-50 p-1.5 border border-red-100">Ghi chú: {order.notes}</p>}
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="font-serif font-bold text-2xl text-blend-red">{order.total}</span>
                                <div className="space-x-2 flex">
                                    {order.status === 'Đã hoàn thành' && order.payment !== 'Tiền mặt' && (
                                         <button className="px-2 py-1 bg-red-50 text-blend-red border border-red-200 hover:bg-red-100 text-sm font-bold transition-colors" title="Hoàn Tiền (Refund)">Refund</button>
                                    )}
                                    <button className="px-3 py-1 bg-gray-100 border border-gray-300 hover:bg-gray-200 transition-colors" title="In Hóa Đơn / Tem"><i className="fa-solid fa-print"></i></button>
                                    {order.status !== 'Đã hủy' && order.status !== 'Đã hoàn thành' && (
                                        <button className="px-3 py-1 bg-blend-blue text-white hover:bg-opacity-90 font-bold transition-colors" title="Cập nhật trạng thái">Duyệt <i className="fa-solid fa-arrow-right ml-1"></i></button>
                                    )}
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const InventoryView = () => {
            const [invTab, setInvTab] = useState('stock');
            return (
                <div>
                    <SectionHeader title="Quản Lý Kho" subtitle="Tối ưu hóa chi phí, ghi nhận nhập/xuất và đảm bảo nguồn nguyên liệu." />
                    
                    <div className="flex gap-6 mb-6 border-b border-gray-200">
                        <button onClick={() => setInvTab('stock')} className={`font-bold pb-3 px-2 transition-colors ${invTab==='stock' ? 'text-blend-blue border-b-2 border-blend-blue' : 'text-gray-500 hover:text-blend-blue'}`}>Tồn Kho</button>
                        <button onClick={() => setInvTab('import')} className={`font-bold pb-3 px-2 transition-colors ${invTab==='import' ? 'text-blend-blue border-b-2 border-blend-blue' : 'text-gray-500 hover:text-blend-blue'}`}>Nhập/Xuất Lịch Sử</button>
                        <button onClick={() => setInvTab('recipe')} className={`font-bold pb-3 px-2 transition-colors ${invTab==='recipe' ? 'text-blend-blue border-b-2 border-blend-blue' : 'text-gray-500 hover:text-blend-blue'}`}>Định Lượng (Recipe)</button>
                    </div>

                    {invTab === 'stock' && (
                        <div className="bg-white editorial-border overflow-hidden shadow-sm">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-blend-blue text-white font-serif text-lg">
                                        <th className="p-4 font-normal">Mã NVL</th>
                                        <th className="p-4 font-normal">Tên Nguyên Liệu</th>
                                        <th className="p-4 font-normal">Đơn Vị</th>
                                        <th className="p-4 font-normal">Tồn Kho</th>
                                        <th className="p-4 font-normal">Định Mức Tối Thiểu</th>
                                        <th className="p-4 font-normal">Tình Trạng</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {MOCK_DATA.inventory.map((item, i) => (
                                        <tr key={i} className="border-b border-gray-200 hover:bg-gray-50">
                                            <td className="p-4 font-bold">{item.id}</td>
                                            <td className="p-4 font-serif text-lg">{item.name}</td>
                                            <td className="p-4 text-gray-600">{item.unit}</td>
                                            <td className={`p-4 font-bold text-lg ${item.status === 'warning' ? 'text-blend-red' : ''}`}>{item.qty}</td>
                                            <td className="p-4 text-gray-500">{item.min}</td>
                                            <td className="p-4">
                                                {item.status === 'warning' 
                                                    ? <span className="text-blend-red font-bold"><i className="fa-solid fa-circle-exclamation"></i> Cần nhập thêm</span>
                                                    : <span className="text-green-600"><i className="fa-solid fa-circle-check"></i> Đủ dùng</span>}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                    
                    {invTab === 'import' && (
                        <div className="editorial-border p-12 text-center text-gray-500 bg-white border-dashed border-2">
                            <i className="fa-solid fa-boxes-packing text-5xl mb-4 text-gray-300"></i>
                            <h3 className="font-serif text-2xl font-bold text-blend-blue mb-2">Ghi Nhận Nhập/Xuất Kho</h3>
                            <p>Tính năng lưu trữ hóa đơn từ nhà cung cấp và lịch sử xuất nguyên liệu ra quầy pha chế.</p>
                            <button className="mt-6 px-6 py-2 bg-blend-blue text-white font-bold hover:bg-opacity-90 shadow-sm transition-opacity">Tạo Phiếu Nhập Kho Mới</button>
                        </div>
                    )}

                    {invTab === 'recipe' && (
                        <div className="editorial-border p-12 text-center text-gray-500 bg-white border-dashed border-2">

        const CustomersView = () => (
            <div>
                <SectionHeader title="Khách Hàng & Thành Viên" subtitle="Hồ sơ liên lạc, lịch sử mua sắm và phân hạng tích điểm." />
                <div className="bg-white editorial-border overflow-hidden shadow-sm">
                    <table className="w-full text-left border-collapse">
                        <thead>
                            <tr className="bg-blend-blue text-white font-serif text-lg">

                                <th className="p-4 font-normal">Liên Hệ</th>
                                <th className="p-4 font-normal">Hạng Thành Viên</th>
                                <th className="p-4 font-normal text-right">Tổng Chi Tiêu</th>
                                <th className="p-4 font-normal text-right">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            {MOCK_DATA.customers.map((c, i) => (
                                <tr key={i} className="border-b border-gray-200 hover:bg-gray-50 transition-colors">

                                    <td className="p-4 text-sm text-gray-600">{c.phone}<br/>{c.email}</td>

                                    <td className="p-4 font-serif text-xl font-bold text-right text-blend-blue">{c.spent}</td>
                                    <td className="p-4 text-right">

                    </table>

        );

            <div>
                <SectionHeader title="Chiến Dịch Khuyến Mãi" subtitle="Kích thích doanh số qua mã giảm giá, voucher và điều kiện áp dụng." />
                <div className="flex justify-between items-center mb-6">
                    <p className="italic text-gray-500">Đang có <span className="font-bold text-blend-blue">2</span> chương trình chạy tự động.</p>
                    <button className="bg-blend-red text-white px-6 py-2 font-bold hover:bg-opacity-90 transition-colors shadow-sm">+ Tạo Voucher Mới</button>

                    {MOCK_DATA.promotions.map((p, i) => (
                        <div key={i} className={`bg-white editorial-border p-0 flex flex-col relative overflow-hidden group shadow-sm ${p.status === 'Đã kết thúc' ? 'opacity-60 grayscale' : ''}`}>

                                <div className="absolute -left-3 -bottom-3 w-6 h-6 bg-blend-paper rounded-full border-t border-r border-blend-red"></div>
                                <div className="absolute -right-3 -bottom-3 w-6 h-6 bg-blend-paper rounded-full border-t border-l border-blend-red"></div>

                                <th className="p-4 font-normal">Nhân Viên</th>

                                <th className="p-4 font-normal text-right">Thao Tác</th>

                        </thead>
                        <tbody>
                            {MOCK_DATA.staff.map((s, i) => (
                                <tr key={i} className={`border-b border-gray-200 transition-colors hover:bg-gray-50 ${s.status === 'Nghỉ việc' ? 'bg-gray-50 text-gray-400' : ''}`}>

                                    </td>
                                    <td className="p-4"><StatusBadge status={s.status} /></td>
                                    <td className="p-4 text-right">
                                        <button className={`${s.status === 'Nghỉ việc' ? 'text-gray-400 cursor-not-allowed' : 'text-blend-blue hover:underline'}`}><i className="fa-solid fa-key"></i> Phân Quyền</button>

                <div className="flex flex-wrap gap-4 mb-6">
                    <button className="px-6 py-2 bg-blend-blue text-white font-bold hover:bg-opacity-90 shadow-sm">Báo Cáo Doanh Thu</button>

                    <button className="px-4 py-2 border border-blend-red bg-white text-blend-red hover:bg-red-50 font-bold shadow-sm"><i className="fa-solid fa-file-pdf mr-2"></i> Xuất PDF</button>

                                <li key={i} className="flex justify-between items-center p-3 bg-gray-50 border border-gray-100 hover:border-blend-blue transition-colors">

                                    <div className="text-right">
                                        <span className="font-serif text-2xl block text-blend-blue font-bold">{row.amount}</span>
                                        <span className={`text-sm font-bold ${row.up ? 'text-green-600' : 'text-blend-red'}`}>
                                            <i className={`fa-solid ${row.up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'} mr-1`}></i> {row.trend}

                    <div className="editorial-border p-8 bg-white shadow-sm flex flex-col justify-between">
                        <div>
                            <h3 className="font-serif text-3xl font-bold mb-6 border-b-2 border-blend-blue pb-2 text-blend-blue">Tỷ Trọng Doanh Thu</h3>

                                    <div className="flex justify-between text-base mb-1 font-bold"><span>Trà Sữa & Topping</span><span className="font-serif text-xl">65%</span></div>
                                    <div className="w-full bg-gray-200 h-3 rounded-full overflow-hidden"><div className="bg-blend-blue h-full" style={{width: '65%'}}></div></div>

                { id: 'inventory', name: 'Quản Lý Kho', icon: 'fa-boxes-stacked' },
                { id: 'customers', name: 'Khách Hàng', icon: 'fa-users' },
                { id: 'promotions', name: 'Khuyến Mãi', icon: 'fa-ticket' },
                { id: 'staff', name: 'Nhân Sự', icon: 'fa-user-tie' },
                { id: 'reports', name: 'Báo Cáo', icon: 'fa-file-invoice-dollar' },

                    </div>
                    <nav className="flex-1 py-6 px-4 space-y-2">
                        {menu.map(item => (

            const renderContent = () => {
                switch (activeTab) {
                    case 'dashboard': return <DashboardView />;
                    case 'products': return <ProductsView />;
                    case 'orders': return <OrdersView />;
                    case 'inventory': return <InventoryView />;
                    case 'customers': return <CustomersView />;
                    case 'promotions': return <PromotionsView />;
                    case 'staff': return <StaffView />;
                    case 'reports': return <ReportsView />;
                    default: return <DashboardView />;
                }

                <div className="flex min-h-screen bg-blend-paper text-gray-800">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />

        root.render(<App />);
    </script>
</body>
</html>
