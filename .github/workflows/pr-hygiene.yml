# ==============================================================================
# Enterprise Governance: Pull Request Hygiene & Conventional Commits Validator
# Enforces semantic commit format: feat, fix, docs, style, refactor, perf, test, ci, chore
# ==============================================================================
name: PR Governance & Semantic Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-pr-title:
    name: 🏷️ Semantic PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Conventional Commits PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
