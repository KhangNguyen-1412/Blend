# ==============================================================================
# Enterprise DevSecOps: Automated Secret Scanning & Key Leak Prevention
# Uses TruffleHog to detect leaked API keys, JWT secrets, DB credentials
# ==============================================================================
name: Secret & Credential Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: 🔑 TruffleHog Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full Git Depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Pull Request for Secrets
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Scan Repository on Push
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
